[package]
name = "glacier_solver"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = "0.15"
nalgebra = { version = "0.33", features = ["sparse"] }
sprs = "0.11"
itertools = "0.12"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "glacier_solver"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
